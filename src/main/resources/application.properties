spring.application.name=garage

# Define variables
POSTGRESQL_DATABASENAME = carsforyou
POSTGRESQL_USERNAME = postgres
POSTGRESQL_PASSWORD = password

# Define database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRESQL_DATABASENAME}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

#Define JPA settings, enable logging yes or no
spring.jpa.show-sql=true

#Force to generate data schema on startup of application
spring.jpa.generate-ddl=true
# create the tables, alternative is update on startup
spring.jpa.hibernate.ddl-auto=create

#database init with a data.sql file after hibernate
spring.sql.init.mode=always
#Whether to defer DataSource initialization until after any EntityManagerFactory beans have been created and initialized.
spring.jpa.defer-datasource-initialization=true
#Additional native properties to set on the JPA provider.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#set customer Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

#make sure to display messages to prevent hiding them by default JSON
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#sort the endpoints so it enhances the readability
springdoc.swagger-ui.tagsSorter=alpha
#sort the endpoints in Swagger GET > POST > PUT > DELETE
springdoc.swagger-ui.operationsSorter=method

#configure wwhere to store the uploaded files via the CustomerUploadService
garage.upload-dir=C:/temp

#security configuration
client-id=VinylShop
client-secret=ihtN5woBPhsSmz4wf5YBeyLF2S51kZxp

issuer-uri=http://localhost:9090/realms/${client-id}
audience=account

